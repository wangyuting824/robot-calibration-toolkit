name: Offline toolkit checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,usd]'
      - run: python -m pytest -q
      - run: python examples/run_offline_demo.py --destination /tmp/robotcal-demo
      - run: python field.py self-test --destination /tmp/robotcal-field-demo
  mujoco:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,mujoco]'
      - run: python -m pytest -q tests/test_mujoco_and_ros_state.py tests/test_joint_motion.py
  ros-motion:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install official ROS action messages
        run: |
          apt-get update
          apt-get install -y ros-jazzy-control-msgs python3-yaml
      - name: Exercise isolated ROS action transport and cancellation
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 examples/verify_motion_ros2.py --destination /tmp/robotcal-ros-motion
